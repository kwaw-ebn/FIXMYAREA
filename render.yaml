services:
  - type: web
    name: fixmyarea-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixmyarea-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.9
  - type: web
    name: fixmyarea-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          name: fixmyarea-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: fixmyarea-db
    plan: free
    databaseName: fixmyarea
